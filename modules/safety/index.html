<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 安全观测台 · 融合镜像</title>
<style>
  :root{--bg:#0a0d13;--panel:#10141d;--panel2:#151a26;--line:#232b3d;--txt:#dbe2f0;--dim:#8b96ad;--acc:#5ec8d8;--acc2:#e8b34b;--red:#e05d5d}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
  header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1119,#0a0d13);padding:26px 22px 18px}
  .wrap{max-width:1080px;margin:0 auto}
  .kicker{color:var(--acc);letter-spacing:.35em;font-size:12px;text-transform:uppercase}
  h1{font-size:30px;margin:8px 0 6px;font-weight:700}
  .sub{color:var(--dim);font-size:13.5px;line-height:1.7}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .bar button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13.5px}
  .bar button:hover{border-color:var(--acc)}
  .bar button:disabled{opacity:.35;cursor:default}
  .datebox{font-size:15px;color:var(--acc2);font-weight:600;min-width:110px;text-align:center}
  .status{color:var(--dim);font-size:12.5px;margin-left:auto}
  main{padding:22px}
  h2.sec{font-size:19px;margin:26px 0 14px;padding-left:10px;border-left:3px solid var(--acc)}
  h2.sec.gold{border-color:var(--acc2)}
  .daily{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;line-height:1.85;font-size:14.5px}
  .daily h1{font-size:21px;margin-bottom:6px}
  .daily h2{font-size:17px;margin:20px 0 8px;color:var(--acc2)}
  .daily h3{font-size:15.5px;margin:18px 0 6px;color:var(--acc)}
  .daily p{margin:7px 0;color:#c3cbdd}
  .daily blockquote{border-left:3px solid var(--line);padding:2px 12px;color:var(--dim);margin:8px 0}
  .daily hr{border:none;border-top:1px solid var(--line);margin:16px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:#33405c}
  .card .tz{font-size:15.5px;font-weight:600;line-height:1.5}
  .card .te{font-size:12.5px;color:var(--dim);line-height:1.5}
  .card .line{font-size:13.5px;color:#c3cbdd;line-height:1.65;flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--dim)}
  .chip.venue{color:var(--acc);border-color:#274b54}
  .authors{font-size:12px;color:var(--dim);line-height:1.5}
  .links{display:flex;gap:14px;font-size:13px}
  .empty{color:var(--dim);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  footer{border-top:1px solid var(--line);margin-top:34px;padding:18px 22px 30px;color:var(--dim);font-size:12.5px;line-height:1.8}
  .err{color:var(--red)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="kicker">AI Safety Observatory</div>
  <h1>AI 安全观测台</h1>
  <div class="sub">融合大屏的本地阅读页：日报与每日精选论文实时读取自 AISafetyHot-Hub 数据仓，本页不存储、不镜像任何内容。</div>
  <div class="bar">
    <button id="prevBtn">← 前一天</button>
    <div class="datebox" id="dateBox">加载中…</div>
    <button id="nextBtn">后一天 →</button>
    <button id="latestBtn">回到最新</button>
    <span class="status" id="status"></span>
  </div>
</div></header>

<main class="wrap">
  <h2 class="sec gold">今日日报</h2>
  <div class="daily" id="daily"><p class="empty">正在读取日报…</p></div>

  <h2 class="sec">每日精选论文 <span id="paperCount" style="color:var(--dim);font-size:14px"></span></h2>
  <div class="grid" id="papers"><p class="empty">正在读取精选…</p></div>
</main>

<footer><div class="wrap">
  数据来源：<a href="https://github.com/ZHANGFA88/AISafetyHot-Hub" target="_blank" rel="noopener">AISafetyHot-Hub</a>（fork 自 wuyoscar） · 内容遵循 <b>CC BY-NC 4.0</b>（署名 — 非商业性使用）· 官网：<a href="https://aisafetyhot.com" target="_blank" rel="noopener">aisafetyhot.com</a><br>
  本页为个人阅读聚合：日报与论文元数据均在浏览器端实时取自上述公开数据仓，版权归原作者与 AISafetyHot 所有。
</div></footer>

<script>
const RAW='https://raw.githubusercontent.com/ZHANGFA88/AISafetyHot-Hub/main';
let cur=null; // 当前显示日期 yyyy-mm-dd
const $=id=>document.getElementById(id);

function fmt(d){return d.toISOString().slice(0,10)}
function shift(dateStr,days){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+days);return fmt(d)}
async function getText(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.text()}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mdRender(md){
  const lines=md.split('\n');let html='',inQuote=false;
  const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(const raw of lines){
    const s=raw.trim();
    if(s.startsWith('>')){if(!inQuote){html+='<blockquote>';inQuote=true}html+='<p>'+inline(s.replace(/^>\s?/,''))+'</p>';continue}
    if(inQuote){html+='</blockquote>';inQuote=false}
    if(!s)continue;
    if(s==='---'){html+='<hr>';continue}
    if(s.startsWith('### ')){html+='<h3>'+inline(s.slice(4))+'</h3>';continue}
    if(s.startsWith('## ')){html+='<h2>'+inline(s.slice(3))+'</h2>';continue}
    if(s.startsWith('# ')){html+='<h1>'+inline(s.slice(2))+'</h1>';continue}
    html+='<p>'+inline(s)+'</p>';
  }
  if(inQuote)html+='</blockquote>';
  return html;
}

async function findLatest(){
  let d=new Date();
  for(let i=0;i<12;i++){
    const ds=fmt(d);
    try{await getText(`${RAW}/daily-papers/${ds.slice(0,4)}/${ds}.json`);return ds}catch(e){d.setDate(d.getDate()-1)}
  }
  throw new Error('近 12 天内未找到数据');
}

async function load(ds){
  cur=ds;$('dateBox').textContent=ds;$('status').textContent='读取中…';
  $('nextBtn').disabled = ds>=fmt(new Date());
  const year=ds.slice(0,4);
  // 日报
  try{
    const md=await getText(`${RAW}/daily/${year}/${ds}.md`);
    $('daily').innerHTML=mdRender(md);
  }catch(e){$('daily').innerHTML='<p class="empty">这一天没有日报文件（可能尚未发布）。</p>'}
  // 精选论文
  try{
    const papers=await getJSON(`${RAW}/daily-papers/${year}/${ds}.json`);
    $('paperCount').textContent='· '+papers.length+' 篇';
    $('papers').innerHTML=papers.map(p=>{
      const authors=(p.authors||[]);const aTxt=authors.length>3?authors.slice(0,3).join('、')+' 等 '+authors.length+' 人':authors.join('、');
      const chips=[p.venue?'<span class="chip venue">'+esc(p.venue)+'</span>':'',p.date?'<span class="chip">'+esc(p.date)+'</span>':''].concat((p.topics||[]).map(t=>'<span class="chip">'+esc(t)+'</span>')).join('');
      return '<article class="card"><div class="tz">'+esc(p.titleZh||p.title||'')+'</div>'
        +(p.titleZh&&p.title?'<div class="te">'+esc(p.title)+'</div>':'')
        +'<div class="line">'+esc(p.line||'')+'</div>'
        +'<div class="meta">'+chips+'</div>'
        +(aTxt?'<div class="authors">'+esc(aTxt)+'</div>':'')
        +'<div class="links">'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">原文 ↗</a>':'')+(p.site?'<a href="'+esc(p.site)+'" target="_blank" rel="noopener">站内页 ↗</a>':'')+'</div></article>';
    }).join('');
    $('status').textContent='已更新 · 数据来自 AISafetyHot-Hub';
  }catch(e){
    $('paperCount').textContent='';
    $('papers').innerHTML='<p class="empty">这一天没有精选文件。</p>';
    $('status').innerHTML='<span class="err">精选读取失败</span>';
  }
}

$('prevBtn').onclick=()=>load(shift(cur,-1));
$('nextBtn').onclick=()=>load(shift(cur,1));
$('latestBtn').onclick=async()=>{try{load(await findLatest())}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};
(async()=>{try{load(await findLatest())}catch(e){$('dateBox').textContent='—';$('daily').innerHTML='<p class="empty err">'+esc(e.message)+'</p>';$('papers').innerHTML=''}})();
</script>
</body>
</html>
