<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易台 · Trading Desk (PAPER)</title>
<style>
:root{--pk:#ff4fb4;--card:#111116;--ln:#24242c;--txt:#ececf1;--mut:#8a8a99;--g:#3dff8f;--r:#ff4d5e;--y:#ffd23f;--c:#3fd5ff;--o:#ff9a3c}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e04aa6;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--txt);font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;padding:10px 12px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hd .lg{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center}
.hd h1{margin:0;font:900 26px/1 system-ui,sans-serif;color:#111;letter-spacing:-.5px}
.hd .sub{font-size:11px;color:#2a0b1e;letter-spacing:1px}
.paper{background:#111;color:var(--y);font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;letter-spacing:1px}
#roomnav{display:flex;gap:4px;align-items:center;margin-left:10px}
#roomnav a{color:#2a0b1e;text-decoration:none;font:800 12px ui-monospace,monospace;padding:4px 9px;border:2px solid #111;border-radius:5px;letter-spacing:1px}
#roomnav a.on{background:#111;color:#ff4fb4}#roomnav a:hover{background:#111;color:#fff}
#langBtn{background:#111;color:#ffd23f;border:2px solid #111;border-radius:5px;font:800 12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
.hd .sp{flex:1}.hd .ttl{font:900 20px system-ui,sans-serif;color:#111}
.pn{background:var(--card);border-radius:7px;padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ph{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.5px;color:#d6d6e0;margin-bottom:6px}.ph b{color:var(--pk)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px 5px;text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--ln)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#1b1b22}tr.sel td{background:#2a1022}
.pos{color:var(--g)}.neg{color:var(--r)}.mut{color:var(--mut)}
.btn{background:#0c0c10;color:var(--pk);border:1px solid #4a2a3c;border-radius:4px;font:700 11px ui-monospace,monospace;padding:4px 10px;cursor:pointer}
.btn:hover{background:#2a1022}.btn.big{font-size:14px;padding:9px 0;width:100%}
.btn.buy{background:var(--g);color:#000;border-color:var(--g)}.btn.sell{background:var(--r);color:#fff;border-color:var(--r)}
input,select{background:#0c0c10;color:var(--txt);border:1px solid #4a2a3c;border-radius:4px;padding:7px 8px;font:700 13px ui-monospace,monospace;width:100%}
label{font-size:10px;color:var(--mut);letter-spacing:1px;display:block;margin:8px 0 3px}
.acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.acc .pn .big{font:900 22px ui-monospace,monospace}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#111;color:var(--txt);border:2px solid #111;border-radius:5px;padding:4px 9px;font:700 12px ui-monospace,monospace;cursor:pointer}
.chip.on{background:var(--pk);color:#000}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px}
.col{display:grid;gap:8px;align-content:start}
#toast{position:fixed;right:14px;bottom:14px;background:#111;border:2px solid var(--pk);color:var(--txt);border-radius:7px;padding:10px 14px;font-size:13px;display:none;z-index:9;max-width:60vw}
</style></head><body>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#ff4fb4"/><rect x="6" y="8" width="3" height="4" fill="#111"/><rect x="13" y="8" width="3" height="4" fill="#111"/></svg></div>
<div><h1>GROKBOT + JEV</h1><div class="sub" id="hsub"></div></div><span class="paper" id="hpaper"></span>
<nav id="roomnav"><a href="index.html" id="rn_office"></a><a href="trade.html" class="on" id="rn_trade"></a><a href="markets.html" id="rn_markets"></a><a href="race.html" id="rn_race"></a><a href="spider.html" id="rn_spider"></a><a href="safety.html" id="rn_safety"></a><button id="langBtn"></button></nav>
<div class="sp"></div><div class="ttl" id="httl"></div></div>

<div class="acc" id="acc"></div>
<div class="chips" id="chips"></div>
<div class="main">
 <div class="col">
  <div class="pn"><div class="ph"><span id="qname">—</span><b id="qpx">—</b></div>
   <canvas id="kc" width="860" height="300" style="width:100%;height:220px"></canvas>
   <div class="mut" id="qmeta" style="font-size:11px;margin-top:4px">—</div></div>
  <div class="pn"><div class="ph"><span id="hpos"></span><b>PAPER</b></div><div id="posw"><table><thead><tr><th data-i="c_mkt"></th><th data-i="c_sym"></th><th data-i="c_qty"></th><th data-i="c_sell"></th><th data-i="c_cost"></th><th data-i="c_px"></th><th data-i="c_mv"></th><th data-i="c_pnl"></th></tr></thead><tbody id="pos"></tbody></table></div></div>
 </div>
 <div class="col">
  <div class="pn"><div class="ph"><span id="hord"></span><b id="fees"></b></div>
   <label data-i="f_mkt"></label><select id="om"><option value="CN">A股 · CNY</option><option value="HK">港股 · HKD</option><option value="US">美股 · USD</option></select>
   <label data-i="f_sym"></label><input id="os" placeholder="600519.SS / 0700.HK / AAPL">
   <label data-i="f_side"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn big buy" id="obuy"></button><button class="btn big" id="osell"></button></div>
   <label data-i="f_type"></label><select id="ot"><option value="market"></option><option value="limit"></option></select>
   <div id="limw" style="display:none"><label data-i="f_price"></label><input id="op" type="number" step="0.01" min="0"></div>
   <label data-i="f_qty"></label><input id="oq" type="number" step="1" min="1" value="100">
   <div class="mut" id="est" style="font-size:11px;margin:8px 0"></div>
   <button class="btn big" id="osub" style="background:var(--pk);color:#000;border-color:var(--pk)"></button>
   <div class="mut" style="font-size:10.5px;margin-top:8px" id="rules"></div></div>
  <div class="pn"><div class="ph"><span id="hords"></span><span><button class="btn" id="reset"></button></span></div>
   <table><thead><tr><th data-i="c_time"></th><th data-i="c_sym"></th><th data-i="c_side"></th><th data-i="c_qty"></th><th data-i="c_fill"></th><th data-i="c_fee"></th><th data-i="c_st"></th><th></th></tr></thead><tbody id="ords"></tbody></table></div>
 </div>
</div>
<div id="toast"></div>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='zh')return q}catch(e){}try{return localStorage.getItem('office_lang')||'zh'}catch(e){return'zh'}})();
const D={zh:{sub:'DEGEN 实验室 · SOLANA MEME 币 · 桌面精选',paper:'📄 PAPER · 虚拟资金',office:'办公室',trade:'交易台',markets:'行情',race:'赛跑',spider:'蜘蛛',safety:'安全',ttl:'股票交易台 · 模拟盘',
 cash:'现金',eq:'权益',pv:'持仓市值',pos:'持仓',ord:'下单',ords:'工单（最近）',reset:'重置模拟账户',
 f_mkt:'市场',f_sym:'代码',f_side:'方向',f_type:'类型',f_price:'限价',f_qty:'数量',buy:'买入',sell:'卖出',market:'市价',limit:'限价',submit:'提交订单',
 c_mkt:'市场',c_sym:'代码',c_qty:'数量',c_sell:'可卖',c_cost:'成本',c_px:'现价',c_mv:'市值',c_pnl:'盈亏',c_time:'时间',c_side:'方向',c_fill:'成交价',c_fee:'费用',c_st:'状态',
 fees:'模拟费率',rules:'模拟规则：A股买入 100 股整数手、T+1 当日买入不可卖；市价单按最新报价成交；限价单挂单等触发。真实下单通道已留口、未接入。',
 est:'预估金额',filled:'已成交',open:'挂单中',cancelled:'已撤销',cancel:'撤单',none:'暂无',ok:'工单 #',fail:'下单失败',stale:'旧价'},
en:{sub:'DEGEN LAB · SOLANA MEMECOINS · DESK PICKS',paper:'📄 PAPER · VIRTUAL MONEY',office:'Office',trade:'Trade Desk',markets:'Markets',race:'Race',spider:'Spider',safety:'Safety',ttl:'STOCK DESK · PAPER',
 cash:'Cash',eq:'Equity',pv:'Positions value',pos:'Positions',ord:'New order',ords:'Orders (recent)',reset:'Reset paper account',
 f_mkt:'Market',f_sym:'Symbol',f_side:'Side',f_type:'Type',f_price:'Limit price',f_qty:'Quantity',buy:'BUY',sell:'SELL',market:'Market',limit:'Limit',submit:'Place order',
 c_mkt:'Market',c_sym:'Symbol',c_qty:'Qty',c_sell:'Sellable',c_cost:'Cost',c_px:'Price',c_mv:'Value',c_pnl:'P&L',c_time:'Time',c_side:'Side',c_fill:'Fill',c_fee:'Fee',c_st:'Status',
 fees:'paper fees',rules:'Paper rules: A-shares buy in 100-share lots, T+1 (same-day buys not sellable); market orders fill at latest quote; limit orders rest until triggered. Real broker gateway is stubbed, not connected.',
 est:'Est. amount',filled:'filled',open:'open',cancelled:'cancelled',cancel:'cancel',none:'none yet',ok:'Order #',fail:'Order failed',stale:'stale'}};
const T=D[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=(v,d=2)=>v==null||isNaN(v)?'—':(+v).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const CSYM={CNY:'¥',HKD:'HK$',USD:'$'};
$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('httl').textContent=T.ttl;
['office','trade','markets','race','spider','safety'].forEach(k=>$('rn_'+k).textContent=T[k]);
$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[e.dataset.i]||e.dataset.i);
$('hpos').textContent=T.pos;$('hord').textContent=T.ord;$('hords').textContent=T.ords;$('reset').textContent=T.reset;$('fees').textContent=T.fees;$('rules').textContent=T.rules;
$('obuy').textContent=T.buy;$('osell').textContent=T.sell;$('osub').textContent=T.submit;
$('ot').options[0].textContent=T.market;$('ot').options[1].textContent=T.limit;
let SIDE='buy',SEL=null,WATCH=[],QUOTES={};
function toast(m,ok){const t=$('toast');t.textContent=m;t.style.display='block';t.style.borderColor=ok?'var(--g)':'var(--r)';setTimeout(()=>t.style.display='none',4200)}
async function J(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
function mktOf(sym){sym=String(sym||'').toUpperCase();if(/\.HK$/.test(sym))return'HK';if(/\.(SS|SZ)$/.test(sym))return'CN';return'US'}
async function loadWatch(){try{const w=await J('/api/finance/watchlist');WATCH=w.items||[];const syms=WATCH.map(x=>x.symbol).join(',');const q=await J('/api/finance/quotes?symbols='+encodeURIComponent(syms));(q.items||[]).forEach(x=>QUOTES[x.symbol]=x);
 $('chips').innerHTML=WATCH.map(x=>{const qq=QUOTES[x.symbol];return`<button class="chip ${SEL===x.symbol?'on':''}" data-sym="${esc(x.symbol)}">${esc(x.symbol)} ${qq?f2(qq.price):'—'} <span class="${(qq&&qq.change_pct>=0)?'pos':'neg'}">${qq?(qq.change_pct>=0?'+':'')+f2(qq.change_pct):''}%</span></button>`}).join('')||'<span class="mut">—</span>';
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>select(c.dataset.sym));if(!SEL&&WATCH.length)select(WATCH[0].symbol);else if(SEL)paintQuote()}catch(e){}}
function select(sym){SEL=sym;$('os').value=sym;$('om').value=mktOf(sym);document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.sym===sym));paintQuote();loadKline()}
function paintQuote(){const q=QUOTES[SEL];if(!q){$('qname').textContent=SEL||'—';return}
 $('qname').textContent=q.name+' · '+q.symbol;$('qpx').innerHTML=`<span class="${q.change_pct>=0?'pos':'neg'}">${f2(q.price)} ${q.change_pct>=0?'▲':'▼'} ${f2(Math.abs(q.change_pct))}%</span>`;
 $('qmeta').textContent=`O ${f2(q.open)} · H ${f2(q.high)} · L ${f2(q.low)} · Prev ${f2(q.prev_close)} · Vol ${q.volume?f2(q.volume,0):'—'}`}
async function loadKline(){if(!SEL)return;try{const d=await J('/api/finance/kline?symbol='+encodeURIComponent(SEL)+'&count=120');const ks=(d.kline||[]).slice(-120);const c=$('kc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(ks.length<2)return;
 let lo=Math.min(...ks.map(k=>k.low)),hi=Math.max(...ks.map(k=>k.high));if(hi-lo<1e-9){hi+=1;lo-=1}const W=c.width,H=c.height,P=26,bw=W/ks.length,Y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
 x.strokeStyle='#24242c';x.beginPath();for(let i=1;i<4;i++){x.moveTo(0,H*i/4);x.lineTo(W,H*i/4)}x.stroke();
 ks.forEach((k,i)=>{const up=k.close>=k.open,col=up?'#3dff8f':'#ff4d5e',cx=i*bw+bw/2;x.strokeStyle=col;x.beginPath();x.moveTo(cx,Y(k.high));x.lineTo(cx,Y(k.low));x.stroke();x.fillStyle=col;const a=Y(Math.max(k.open,k.close)),b2=Y(Math.min(k.open,k.close));x.fillRect(i*bw+1,a,Math.max(1,bw-2),Math.max(1,b2-a))});
 x.fillStyle='#8a8a99';x.font='11px ui-monospace,monospace';x.fillText(f2(hi),6,14);x.fillText(f2(lo),6,H-6);x.fillText(ks[0].date+' → '+ks[ks.length-1].date,W-190,14)}catch(e){}}
async function loadAcct(){try{const a=await J('/api/trade/account');$('acc').innerHTML=(a.accounts||[]).map(x=>`<div class="pn"><div class="ph"><span>${esc(x.market_name)} · ${esc(x.market)}</span><b>${esc(x.currency)}</b></div><div class="big">${CSYM[x.currency]||''}${f2(x.equity,0)}</div><div class="mut" style="font-size:11px">${T.cash} ${f2(x.cash)} · ${T.pv} ${f2(x.positions_value)} · ${T.pos} ${x.positions}</div></div>`).join('')}catch(e){}}
async function loadPos(){try{const d=await J('/api/trade/positions');$('pos').innerHTML=(d.positions||[]).map(p=>`<tr class="clk" data-sym="${esc(p.symbol)}"><td>${esc(p.market)}</td><td>${esc(p.symbol)}<br><span class="mut">${esc(p.name||'')}</span></td><td>${p.qty}</td><td>${p.sellable_qty}</td><td>${f2(p.avg_cost,3)}</td><td>${p.price==null?'—':f2(p.price)}${p.price_stale?' <span class="mut">'+T.stale+'</span>':''}</td><td>${p.market_value==null?'—':f2(p.market_value)}</td><td class="${(p.unrealized_pnl||0)>=0?'pos':'neg'}">${p.unrealized_pnl==null?'—':f2(p.unrealized_pnl)+' ('+f2(p.unrealized_pnl_pct)+'%)'}</td></tr>`).join('')||`<tr><td colspan="8" class="mut">${T.none}</td></tr>`;
 document.querySelectorAll('#pos tr.clk').forEach(r=>r.onclick=()=>select(r.dataset.sym))}catch(e){}}
async function loadOrds(){try{const d=await J('/api/trade/orders');$('ords').innerHTML=(d.orders||[]).slice(0,30).map(o=>`<tr><td class="mut">${o.ts?new Date(o.ts*1000).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):''}</td><td>${esc(o.symbol)}</td><td class="${o.side==='buy'?'pos':'neg'}">${o.side==='buy'?T.buy:T.sell}</td><td>${o.qty}</td><td>${o.fill_price==null?(o.limit_price||'—'):f2(o.fill_price)}</td><td>${f2(o.fee)}</td><td>${T[o.status]||o.status}</td><td>${o.status==='open'?`<button class="btn" data-cancel="${o.id}">${T.cancel}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="mut">${T.none}</td></tr>`;
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{try{await J('/api/trade/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.cancel})});refresh()}catch(e){toast(e.message,0)}})}catch(e){}}
function refresh(){loadAcct();loadPos();loadOrds()}
function est(){const q=QUOTES[$('os').value.trim().toUpperCase()];const px=$('ot').value==='limit'?parseFloat($('op').value):(q?q.price:null);const qty=parseFloat($('oq').value)||0;$('est').textContent=px?T.est+': '+f2(px*qty):''}
$('obuy').onclick=()=>{SIDE='buy';$('obuy').className='btn big buy';$('osell').className='btn big';$('osub').style.background='var(--g)';};
$('osell').onclick=()=>{SIDE='sell';$('osell').className='btn big sell';$('obuy').className='btn big';$('osub').style.background='var(--r)';$('osub').style.color='#fff';};
$('ot').onchange=()=>{$('limw').style.display=$('ot').value==='limit'?'block':'none';est()};
['os','oq','op'].forEach(i=>$(i).addEventListener('input',()=>{if(i==='os'){$('om').value=mktOf($('os').value)}est()}));
$('osub').onclick=async()=>{const body={market:$('om').value,symbol:$('os').value.trim(),side:SIDE,qty:+$('oq').value,type:$('ot').value};if(body.type==='limit')body.price=parseFloat($('op').value);
 try{const r=await J('/api/trade/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast(T.ok+(r.id??'')+(r.status?' · '+(T[r.status]||r.status):''),1);refresh()}catch(e){toast(T.fail+': '+e.message,0)}};
$('reset').onclick=async()=>{try{await J('/api/trade/reset',{method:'POST'});refresh();toast(T.reset+' ✓',1)}catch(e){toast(e.message,0)}};
loadWatch();refresh();setInterval(()=>{loadWatch();refresh()},15000);
</script></body></html>
