$('hpos').textContent=T.pos;$('hord').textContent=T.ord;$('hords').textContent=T.ords;$('hnews').textContent=T.news;$('reset').textContent=T.reset;$('fees').textContent=T.fees;$('rules').textContent=T.rules;
$('obuy').textContent=T.buy;$('osell').textContent=T.sell;$('osub').textContent=T.submit;

let SIDE='buy',SEL=null,WATCH=[],QUOTES={},ACCTS=[],POS=[],PERIOD='daily',KS=[];
function toast(m,ok){const t=$('toast');t.textContent=m;t.style.display='block';t.style.borderColor=ok?'var(--g)':'var(--r)';setTimeout(()=>t.style.display='none',4200)}
async function J(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
function mktOf(sym){sym=String(sym||'').toUpperCase();if(/\.HK$/.test(sym))return'HK';if(/\.(SS|SZ)$/.test(sym))return'CN';return'US'}
async function loadTape(){try{const ix=await J('/api/finance/indices');const items=(ix.items||[]).concat(WATCH.map(w=>QUOTES[w.symbol]).filter(Boolean).map(q=>({name:q.name,price:q.price,change_pct:q.change_pct})));
 const one=items.map(x=>`<span><b>${esc(x.name)}</b> ${f2(x.price)} <span class="${x.change_pct>=0?'pos':'neg'}">${x.change_pct>=0?'+':''}${f2(x.change_pct)}%</span></span>`).join('');
 $('tapeIn').innerHTML=one+one}catch(e){}}
async function loadWatch(){try{const w=await J('/api/finance/watchlist');WATCH=w.items||[];const syms=WATCH.map(x=>x.symbol).join(',');const q=await J('/api/finance/quotes?symbols='+encodeURIComponent(syms));(q.items||[]).forEach(x=>QUOTES[x.symbol]=x);
 $('chips').innerHTML=WATCH.map(x=>{const qq=QUOTES[x.symbol];return`<button class="chip ${SEL===x.symbol?'on':''}" data-sym="${esc(x.symbol)}">${esc(x.symbol)} ${qq?f2(qq.price):'—'} <span class="${(qq&&qq.change_pct>=0)?'pos':'neg'}">${qq?(qq.change_pct>=0?'+':'')+f2(qq.change_pct):''}%</span></button>`}).join('')||'<span class="mut">—</span>';
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>select(c.dataset.sym));if(!SEL&&WATCH.length)select(WATCH[0].symbol);else if(SEL)paintQuote()}catch(e){}}
function select(sym){SEL=sym;$('os').value=sym;$('om').value=mktOf(sym);document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.sym===sym));paintQuote();loadKline();loadInd();paintQchips();est()}
function paintQuote(){const q=QUOTES[SEL];if(!q){$('qname').textContent=SEL||'—';return}
 $('qname').textContent=q.name+' · '+q.symbol;$('qpx').innerHTML=`<span class="${q.change_pct>=0?'pos':'neg'}">${f2(q.price)} ${q.change_pct>=0?'▲':'▼'} ${f2(Math.abs(q.change_pct))}%</span>`;
 $('qmeta').textContent=`O ${f2(q.open)} · H ${f2(q.high)} · L ${f2(q.low)} · Prev ${f2(q.prev_close)} · Vol ${q.volume?f2(q.volume,0):'—'}`}
function maArr(ks,n){const o=[];let s=0;for(let i=0;i<ks.length;i++){s+=ks[i].close;if(i>=n)s-=ks[i-n].close;o.push(i>=n-1?s/n:null)}return o}
function drawK(hover){const c=$('kc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const ks=KS;if(ks.length<2)return;
 let lo=Math.min(...ks.map(k=>k.low)),hi=Math.max(...ks.map(k=>k.high));if(hi-lo<1e-9){hi+=1;lo-=1}
 const W=c.width,H=c.height,PH=Math.round(H*0.78),P=22,bw=W/ks.length,Y=v=>PH-P-(v-lo)/(hi-lo)*(PH-2*P),vmax=Math.max(...ks.map(k=>k.volume||0))||1;
 x.strokeStyle='#24242c';x.beginPath();for(let i=1;i<4;i++){x.moveTo(0,PH*i/4);x.lineTo(W,PH*i/4)}x.stroke();
 ks.forEach((k,i)=>{const up=k.close>=k.open,col=up?'#3dff8f':'#ff4d5e',cx=i*bw+bw/2;
  x.fillStyle=col;x.globalAlpha=.55;const vh=(k.volume||0)/vmax*(H-PH-14);x.fillRect(i*bw+1,H-vh,Math.max(1,bw-2),vh);x.globalAlpha=1;
  x.strokeStyle=col;x.beginPath();x.moveTo(cx,Y(k.high));x.lineTo(cx,Y(k.low));x.stroke();const a=Y(Math.max(k.open,k.close)),b2=Y(Math.min(k.open,k.close));x.fillStyle=col;x.fillRect(i*bw+1,a,Math.max(1,bw-2),Math.max(1,b2-a))});
 const line=(arr,col)=>{x.strokeStyle=col;x.lineWidth=1.2;x.beginPath();let st=false;arr.forEach((v,i)=>{if(v==null)return;const cx=i*bw+bw/2,cy=Y(v);if(!st){x.moveTo(cx,cy);st=true}else x.lineTo(cx,cy)});x.stroke();x.lineWidth=1};
 line(maArr(ks,5),'#ffd23f');line(maArr(ks,20),'#3fd5ff');
 const lp=ks[ks.length-1].close;x.strokeStyle='rgba(255,79,180,.6)';x.setLineDash([4,4]);x.beginPath();x.moveTo(0,Y(lp));x.lineTo(W,Y(lp));x.stroke();x.setLineDash([]);
 x.fillStyle='#8a8a99';x.font='11px ui-monospace,monospace';x.fillText(f2(hi),6,14);x.fillText(f2(lo),6,PH-6);x.fillText(ks[0].date+' → '+ks[ks.length-1].date,6,H-4);
 x.fillStyle='#ffd23f';x.fillText('MA5',W-118,14);x.fillStyle='#3fd5ff';x.fillText('MA20',W-76,14);
 if(hover!=null&&ks[hover]){const k=ks[hover],cx=hover*bw+bw/2;x.strokeStyle='rgba(236,236,241,.35)';x.beginPath();x.moveTo(cx,0);x.lineTo(cx,H);x.stroke();
  $('qmeta').textContent=`${k.date} · O ${f2(k.open)} · H ${f2(k.high)} · L ${f2(k.low)} · C ${f2(k.close)} · Vol ${k.volume?f2(k.volume,0):'—'}`}}
async function loadKline(){if(!SEL)return;try{const d=await J('/api/finance/kline?symbol='+encodeURIComponent(SEL)+'&period='+PERIOD+'&count=120');KS=(d.kline||[]).slice(-120);drawK()}catch(e){}}
async function loadInd(){if(!SEL)return;try{const d=await J('/api/finance/analyze?symbol='+encodeURIComponent(SEL));const I=d.indicators||{};if(!I.ok){$('ind').innerHTML='';return}
 const rsi=I.rsi,rsiT=rsi>=70?T.rsiOb:rsi<=30?T.rsiOs:T.rsiN,rsiC=rsi>=70?'neg':rsi<=30?'pos':'';
 const mc=I.macd||{},kd=I.kdj||{},bo=I.boll||{};
 const box=(k,v,c)=>`<div class="ib"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;
 $('ind').innerHTML=box('MA5 / MA10',f2((I.ma||{}).MA5)+' / '+f2((I.ma||{}).MA10))+box('MA20 / MA60',f2((I.ma||{}).MA20)+' / '+f2((I.ma||{}).MA60))
 +box('RSI',f2(rsi,1)+' · '+rsiT,rsiC)+box('MACD',f2(mc.DIF,2)+' / '+f2(mc.DEA,2),mc.trend==='up'?'pos':'neg')
 +box('KDJ',f2(kd.K,0)+' / '+f2(kd.D,0)+' / '+f2(kd.J,0),kd.signal==='overbought'?'neg':kd.signal==='oversold'?'pos':'')
 +box('BOLL',f2(bo.lower,0)+' ~ '+f2(bo.upper,0))+box((LANG==='zh'?'量比':'Vol ratio'),'5d '+f2((I.volume||{}).vol_ratio_5)+' · 20d '+f2((I.volume||{}).vol_ratio_20))
 +box((LANG==='zh'?'20日高低':'20d H/L'),f2((I.high_low||{}).high_20)+' / '+f2((I.high_low||{}).low_20))}catch(e){$('ind').innerHTML=''}}
async function loadAcct(){try{const a=await J('/api/trade/account');ACCTS=a.accounts||[];$('acc').innerHTML=ACCTS.map(x=>`<div class="pn"><div class="ph"><span>${esc(x.market_name)} · ${esc(x.market)}</span><b>${esc(x.currency)}</b></div><div class="big">${CSYM[x.currency]||''}${f2(x.equity,0)}</div><div class="mut" style="font-size:11px">${T.cash} ${f2(x.cash)} · ${T.pv} ${f2(x.positions_value)} · ${T.pos} ${x.positions}</div></div>`).join('');paintQchips()}catch(e){}}
async function loadPos(){try{const d=await J('/api/trade/positions');POS=d.positions||[];const tot={};POS.forEach(p=>{if(p.market_value!=null)tot[p.market]=(tot[p.market]||0)+p.market_value});
 $('pos').innerHTML=POS.map(p=>{const share=p.market_value!=null&&tot[p.market]?p.market_value/tot[p.market]*100:null;
 return`<tr class="clk" data-sym="${esc(p.symbol)}"><td>${esc(p.market)}</td><td>${esc(p.symbol)}<br><span class="mut">${esc(p.name||'')}</span></td><td>${p.qty}</td><td>${p.sellable_qty}</td><td>${f2(p.avg_cost,3)}</td><td>${p.price==null?'—':f2(p.price)}${p.price_stale?' <span class="mut">'+T.stale+'</span>':''}</td><td>${p.market_value==null?'—':f2(p.market_value)}</td><td>${share==null?'—':`<div class="alloc"><i style="width:${share.toFixed(1)}%"></i></div><span class="mut">${f2(share,1)}%</span>`}</td><td class="${(p.unrealized_pnl||0)>=0?'pos':'neg'}">${p.unrealized_pnl==null?'—':f2(p.unrealized_pnl)+' ('+f2(p.unrealized_pnl_pct)+'%)'}</td></tr>`}).join('')||`<tr><td colspan="9" class="mut">${T.none}</td></tr>`;
 document.querySelectorAll('#pos tr.clk').forEach(r=>r.onclick=()=>select(r.dataset.sym));est()}catch(e){}}
async function loadOrds(){try{const d=await J('/api/trade/orders');$('ords').innerHTML=(d.orders||[]).slice(0,30).map(o=>`<tr><td class="mut">${o.ts?new Date(o.ts*1000).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):''}</td><td>${esc(o.symbol)}</td><td class="${o.side==='buy'?'pos':'neg'}">${o.side==='buy'?T.buy:T.sell}</td><td>${o.qty}</td><td>${o.fill_price==null?(o.limit_price||'—'):f2(o.fill_price)}</td><td>${f2(o.fee)}</td><td>${T[o.status]||o.status}</td><td>${o.status==='open'?`<button class="btn" data-cancel="${o.id}">${T.cancel}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="mut">${T.none}</td></tr>`;
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{try{await J('/api/trade/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.cancel})});refresh()}catch(e){toast(e.message,0)}})}catch(e){}}
async function loadNews(){try{const d=await J('/api/finance/news');$('news').innerHTML=(d.items||[]).slice(0,6).map(n=>`<div class="nws"><span class="tm">${esc((n.time||'').slice(11,16))}</span><a href="${esc(n.url||'#')}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join('')||'<span class="mut">—</span>'}catch(e){}}
function refresh(){loadAcct();loadPos();loadOrds()}
function feeEst(mkt,amt,side){if(amt<=0)return 0;if(mkt==='CN'){let f=Math.max(5,amt*0.00025);if(side==='sell')f+=amt*0.0005;return f}if(mkt==='HK')return amt*(0.0003+0.000057);return 0}
function est(){const sym=$('os').value.trim().toUpperCase();const q=QUOTES[sym];const px=$('ot').value==='limit'?parseFloat($('op').value):(q?q.price:null);const qty=parseFloat($('oq').value)||0;
 $('est').textContent=px?T.est+': '+f2(px*qty)+' · '+T.estfee+': '+f2(feeEst($('om').value,px*qty,SIDE)):''}
function paintQchips(){const qs=[100,200,500,1000];$('qchips').innerHTML=qs.map(n=>`<button class="qchip" data-q="${n}">${n}</button>`).join('')+`<button class="qchip" data-q="half">${T.half}</button><button class="qchip" data-q="all">${T.all}</button>`;
 document.querySelectorAll('#qchips .qchip').forEach(b=>b.onclick=()=>{const v=b.dataset.q;
  if(v==='half'||v==='all'){const mkt=$('om').value,acc=ACCTS.find(a=>a.market===mkt);const sym=$('os').value.trim().toUpperCase();const q=QUOTES[sym];const frac=v==='half'?0.5:1;
   if(SIDE==='buy'&&acc&&q&&q.price>0){let n=Math.floor(acc.cash*frac/q.price);if(mkt==='CN')n=Math.floor(n/100)*100;$('oq').value=Math.max(0,n)}
   else if(SIDE==='sell'){const p=POS.find(x=>x.symbol===sym&&x.market===mkt);if(p)$('oq').value=Math.floor(p.sellable_qty*frac)}}
  else $('oq').value=v;est()})}
$('kc').addEventListener('mousemove',e=>{if(!KS.length)return;const r=$('kc').getBoundingClientRect();const bw=r.width/KS.length;const i=Math.max(0,Math.min(KS.length-1,Math.floor((e.clientX-r.left)/bw)));drawK(i)});
$('kc').addEventListener('mouseleave',()=>{drawK();paintQuote()});
document.querySelectorAll('#pchips .pchip').forEach(b=>b.onclick=()=>{PERIOD=b.dataset.p;document.querySelectorAll('#pchips .pchip').forEach(x=>x.classList.toggle('on',x===b));loadKline()});
$('obuy').onclick=()=>{SIDE='buy';$('obuy').className='btn big buy';$('osell').className='btn big';$('osub').style.background='var(--g)';paintQchips();est()};
$('osell').onclick=()=>{SIDE='sell';$('osell').className='btn big sell';$('obuy').className='btn big';$('osub').style.background='var(--r)';$('osub').style.color='#fff';paintQchips();est()};
$('ot').onchange=()=>{$('limw').style.display=$('ot').value==='limit'?'block':'none';est()};
['os','oq','op'].forEach(i=>$(i).addEventListener('input',()=>{if(i==='os'){$('om').value=mktOf($('os').value)}est()}));
$('osub').onclick=async()=>{const body={market:$('om').value,symbol:$('os').value.trim(),side:SIDE,qty:+$('oq').value,type:$('ot').value};if(body.type==='limit')body.price=parseFloat($('op').value);
 try{const r=await J('/api/trade/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast(T.ok+(r.id??'')+(r.status?' · '+(T[r.status]||r.status):''),1);refresh()}catch(e){toast(T.fail+': '+e.message,0)}};
$('reset').onclick=async()=>{try{await J('/api/trade/reset',{method:'POST'});refresh();toast(T.reset+' ✓',1)}catch(e){toast(e.message,0)}};
loadWatch().then(()=>loadTape());refresh();loadNews();
setInterval(()=>{loadWatch();refresh()},15000);setInterval(()=>{loadTape();loadNews();if(SEL)loadInd()},60000);
</script></body></html>
