<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财经观测台 · Observatory</title>
<style>
:root{--pk:#ff4fb4;--card:#111116;--ln:#24242c;--txt:#ececf1;--mut:#8a8a99;--g:#3dff8f;--r:#ff4d5e;--y:#ffd23f;--c:#3fd5ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e04aa6;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--txt);font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;padding:10px 12px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hd .lg{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center}
.hd h1{margin:0;font:900 26px/1 system-ui,sans-serif;color:#111}.hd .sub{font-size:11px;color:#2a0b1e;letter-spacing:1px}
.paper{background:#111;color:var(--y);font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;letter-spacing:1px}
#roomnav{display:flex;gap:4px;align-items:center;margin-left:10px;flex-wrap:wrap}
#roomnav a{color:#2a0b1e;text-decoration:none;font:800 12px ui-monospace,monospace;padding:4px 9px;border:2px solid #111;border-radius:5px;letter-spacing:1px}
#roomnav a.on{background:#111;color:#ff4fb4}#roomnav a:hover{background:#111;color:#fff}
#langBtn{background:#111;color:#ffd23f;border:2px solid #111;border-radius:5px;font:800 12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
.hd .sp{flex:1}.hd .ttl{font:900 20px system-ui,sans-serif;color:#111}
.pn{background:var(--card);border-radius:7px;padding:12px 14px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ph{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;color:#d6d6e0;margin-bottom:8px}
.ph .t{font:900 15px system-ui,sans-serif;color:var(--txt);letter-spacing:2px}
.ph b{color:var(--pk);font-weight:800}
.ph a{margin-left:auto;color:var(--pk);font-size:11px}
#hotframe{width:100%;height:calc(100vh - 165px);min-height:640px;border:2px solid #111;border-radius:8px;background:#fff}
#hothow{display:none;font-size:12.5px;line-height:1.9;color:#d6d6e0;margin-top:8px}
#hothow code{background:#0c0c10;padding:1px 6px;border-radius:3px;color:var(--c)}
.mut{color:var(--mut)}
</style></head><body>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#ff4fb4"/><rect x="6" y="8" width="3" height="4" fill="#111"/><rect x="13" y="8" width="3" height="4" fill="#111"/></svg></div>
<div><h1>GROKBOT + JEV</h1><div class="sub" id="hsub"></div></div><span class="paper" id="hpaper"></span>
<nav id="roomnav"><a href="index.html" id="rn_office"></a><a href="trade.html" id="rn_trade"></a><a href="markets.html" id="rn_markets"></a><a href="race.html" id="rn_race"></a><a href="spider.html" id="rn_spider"></a><a href="safety.html" class="on" id="rn_safety"></a><button id="langBtn"></button></nav>
<div class="sp"></div><div class="ttl" id="httl"></div></div>
<div class="pn"><div class="ph"><span class="t" id="hroom"></span><b id="hotstat">…</b><a id="hotopen" href="http://localhost:3000" target="_blank" rel="noopener"></a></div>
<iframe id="hotframe" src="http://localhost:3000" title="财经观测台"></iframe>
<div class="mut" id="hothow"></div></div>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='zh')return q}catch(e){}try{return localStorage.getItem('office_lang')||'zh'}catch(e){return'zh'}})();
const D={zh:{sub:'DEGEN 实验室 · SOLANA MEME 币 · 桌面精选',paper:'📄 PAPER · 虚拟资金',office:'办公室',trade:'交易台',markets:'行情',race:'赛跑',spider:'蜘蛛',safety:'财经观测台',ttl:'财经观测台',room:'财经观测台 · 实时市况',hotOn:'● 运行中',hotOff:'○ 未启动',hotOpen:'新窗口打开 →',hotHow:'市况台服务还没启动：<br>1. 克隆 <code>ZHANGFA88/shikuang</code>（即市况台源码仓）；<br>2. 在 <code>.env</code> 里填入模型 Key（GPT / Gemini / 千问 / DeepSeek 任选一行配好）；<br>3. 跑 <code>docker compose up -d --build</code>，它就会直接出现在这间分室里。'},
en:{sub:'DEGEN LAB · SOLANA MEMECOINS · DESK PICKS',paper:'📄 PAPER · VIRTUAL MONEY',office:'Office',trade:'Trade Desk',markets:'Markets',race:'Race',spider:'Spider',safety:'Observatory',ttl:'FINANCE OBSERVATORY',room:'FINANCE OBSERVATORY · LIVE MARKET',hotOn:'● Running',hotOff:'○ Not started',hotOpen:'Open in new tab →',hotHow:'The observatory service is not running yet:<br>1. Clone <code>ZHANGFA88/shikuang</code>;<br>2. Put a model key into <code>.env</code> (GPT / Gemini / Qwen / DeepSeek);<br>3. Run <code>docker compose up -d --build</code> — it will appear right in this room.'}};
const T=D[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
const $=i=>document.getElementById(i);
$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('httl').textContent=T.ttl;$('hroom').textContent=T.room;
$('hotopen').textContent=T.hotOpen;$('hothow').innerHTML=T.hotHow;
['office','trade','markets','race','spider','safety'].forEach(k=>$('rn_'+k).textContent=T[k]);
$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
async function probeHot(){const st=$('hotstat');try{const c=new AbortController();setTimeout(()=>c.abort(),3000);await fetch('http://localhost:3000/',{mode:'no-cors',signal:c.signal});st.textContent=T.hotOn;$('hotframe').style.display='block';$('hothow').style.display='none'}catch(e){st.textContent=T.hotOff;$('hotframe').style.display='none';$('hothow').style.display='block'}}
probeHot();setInterval(probeHot,30000);
</script></body></html>
